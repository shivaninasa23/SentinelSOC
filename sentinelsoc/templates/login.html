<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · SentinelSOC</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="login-page"><div class="login-card"><a class="brand" href="#"><span class="brand-icon">S</span><span>SENTINEL<span class="brand-sub">SECURITY OPERATIONS</span></span></a><p class="eyebrow mt-5">SECURE ACCESS</p><h1>Welcome back</h1><p class="muted">Sign in to your security workspace.</p>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="error">{{ message }}</div>{% endfor %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username</label><input name="username" required maxlength="80" autocomplete="username"><label>Password</label><input name="password" required type="password" autocomplete="current-password"><button class="btn-primary w-100 mt-4">Sign in</button></form><p class="tiny muted mt-4">Access is monitored and recorded.</p></div></body></html>
